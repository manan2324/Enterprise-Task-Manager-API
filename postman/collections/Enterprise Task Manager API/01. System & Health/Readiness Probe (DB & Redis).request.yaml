$kind: http-request
description: Verifies real live connections to PostgreSQL (SELECT 1) and Redis (PING). Returns 503 if degraded.
url: "{{baseUrl}}/ready"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 2000
