$kind: http-request
description: Lists all metadata records of files attached to this task.
url: "{{baseUrl}}/tasks/{{taskId}}/attachments"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 3000
