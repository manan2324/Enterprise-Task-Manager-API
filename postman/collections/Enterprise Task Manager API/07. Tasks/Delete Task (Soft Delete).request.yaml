$kind: http-request
description: Sets deletedAt timestamp and appends task.deleted activity record.
url: "{{baseUrl}}/tasks/{{taskId}}"
method: DELETE
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 8000
