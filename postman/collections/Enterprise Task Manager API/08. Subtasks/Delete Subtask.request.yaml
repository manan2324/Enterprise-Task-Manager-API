$kind: http-request
description: Deletes subtask from parent task.
url: "{{baseUrl}}/tasks/{{taskId}}/subtasks/{{subtaskId}}"
method: DELETE
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 3000
