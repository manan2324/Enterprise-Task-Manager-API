$kind: http-request
description: Deletes board and all nested columns and tasks.
url: "{{baseUrl}}/boards/{{boardId}}"
method: DELETE
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 8000
