$kind: http-request
description: Retrieves workspace summary, active member counts, and user role.
url: "{{baseUrl}}/workspaces/{{workspaceId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 3000
