name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: taskmanager_test
        ports:
          - '5432:5432'
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - '6379:6379'
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://app:app@localhost:5432/taskmanager_test
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-test-access-secret-at-least-32-chars!!
      JWT_REFRESH_SECRET: ci-test-refresh-secret-at-least-32-chars!
      APP_URL: http://localhost:3000
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      S3_BUCKET: test-bucket
      S3_ACCESS_KEY_ID: test
      S3_SECRET_ACCESS_KEY: test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npx prisma migrate deploy
      - run: npm run test:cov
      - run: npm run build

  deploy:
    name: Deploy to Production
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trigger deploy via host webhook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          RAILWAY_DEPLOY_TOKEN: ${{ secrets.RAILWAY_DEPLOY_TOKEN }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            echo "Triggering Render deployment webhook..."
            curl -f -X POST "$RENDER_DEPLOY_HOOK"
            echo "Render deployment triggered successfully."
          elif [ -n "$RAILWAY_DEPLOY_TOKEN" ]; then
            echo "Deploying to Railway..."
            npx @railway/cli up --detach
          else
            echo "⚠️ No deployment webhook or token configured in GitHub Secrets (RENDER_DEPLOY_HOOK / RAILWAY_DEPLOY_TOKEN)."
            echo "Skipping automated cloud deploy step."
          fi
